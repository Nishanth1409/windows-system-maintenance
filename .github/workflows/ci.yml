name: Script Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Analyze scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path .\scripts -Filter *.ps1 -Recurse -ErrorAction SilentlyContinue
          if (-not $files) { Write-Host "No scripts found"; exit 0 }
          $issues = Invoke-ScriptAnalyzer -Path .\scripts -Recurse -Severity @('Error') -ErrorAction SilentlyContinue
          if ($issues) {
            $issues | Format-Table -AutoSize
            # Soft-fail: report but do not block first publish
            Write-Host "::warning::PSScriptAnalyzer reported $($issues.Count) error-level finding(s)"
          } else {
            Write-Host "No Error-level findings"
          }
      - name: Verify GUIDE present
        shell: pwsh
        run: Test-Path .\GUIDE.md | ForEach-Object { if (-not $_) { throw "GUIDE.md missing" } }
